name: Build Atlas Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate embedded JavaScript
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/conversation.js
          node --check app/src/main/assets/universal.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-financial-os-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
